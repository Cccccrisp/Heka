<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Heka · 观察资料</title><link rel="stylesheet" href="workbench.css" /></head>
<body><div class="app-frame"><aside class="sidebar"><a class="brand" href="index.html"><img src="assets/heka-wordmark-tight.png" alt="HEKA" /></a><p class="brand-subtitle">PERSONAL INTELLIGENCE LOOP</p><nav><a href="index.html"><span>01</span> 当前问题</a><a class="active" href="evidence.html"><span>02</span> 观察资料</a><a href="model.html"><span>03</span> 模型与反证</a><a href="archive.html"><span>04</span> 档案与设置</a></nav><p class="local-mark">● PRIVATE / LOCAL-FIRST</p></aside>
<main class="workspace"><header class="page-header"><p class="eyebrow">EVIDENCE INBOX</p><p class="runtime">事实先于解释</p></header><section class="page-intro compact"><p class="eyebrow">02 / 观察资料</p><h1>留下一个真实片段。</h1><p>本地模型会把它拆成事实、候选解释和待确认提案；它不会自动改写你的模型。</p></section>
<section class="compose"><textarea id="record" maxlength="2000" placeholder="今天发生了什么？你做了什么选择？当时为什么这样判断？"></textarea><div class="panel-footer"><p id="capture-feedback" class="feedback">原始记录只发给本地模型。</p><button id="capture" class="primary">生成观察 <b>→</b></button></div></section>
<section class="case-section"><div class="section-label"><p class="eyebrow">WAITING FOR YOU</p><h2>待你确认的解释 <span id="proposal-count" class="badge">0</span></h2></div><div id="pending-list" class="proposal-list"><p class="empty">没有待审阅的提案。</p></div></section></main></div>
<template id="proposal-template"><article class="proposal"><p class="proposal-record"></p><div class="evidence-grid"><div><span>观察到</span><p class="facts"></p></div><div><span>可能意味着</span><p class="interpretations"></p></div><div><span>Heka 提议</span><p class="proposal-reason"></p></div></div><div class="proposal-actions"><button class="quiet reject">保留，但不接受</button><button class="accept">确认并更新</button></div></article></template><script src="evidence.js"></script></body></html>
