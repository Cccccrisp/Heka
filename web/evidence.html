<main class="workspace"><header class="page-header"><p class="eyebrow">EVIDENCE REVIEW</p><p class="runtime">事实先于解释</p></header><section class="page-intro compact"><p class="eyebrow">02 / 审阅与证据</p><h1>判断这条 Trace 是否值得进入模型。</h1><p>记录只在「记录 Trace」完成；这里不再重复收集内容，只让你确认、拒绝或保留候选解释。</p></section>
<section class="case-section"><div class="section-label"><p class="eyebrow">WAITING FOR YOU</p><h2>待你确认的解释 <span id="proposal-count" class="badge">0</span></h2></div><div id="pending-list" class="proposal-list"><p class="empty">没有待审阅的提案。</p></div></section></main></div>
<template id="proposal-template"><article class="proposal"><p class="proposal-record"></p><div class="evidence-grid"><div><span>观察到</span><p class="facts"></p></div><div><span>可能意味着</span><p class="interpretations"></p></div><div><span>Heka 提议</span><p class="proposal-reason"></p></div></div><div class="proposal-actions"><button class="quiet reject">保留，但不接受</button><button class="accept">确认并更新</button></div></article></template><script src="evidence.js"></script></body></html>
