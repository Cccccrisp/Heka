name: Package Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Build Heka executable
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name Heka
          --add-data "web;web" --add-data "heka;heka"
          desktop/windows_launcher.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Create installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows-installer.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Heka-Windows-Setup
          path: installer/output/Heka-Setup.exe
          if-no-files-found: error
